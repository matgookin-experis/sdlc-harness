# Credentials are read from a gitignored .env file in this directory.
# Copy .env.example to .env and set GITLAB_ROOT_PASSWORD before starting.

services:
  gitlab:
    image: gitlab/gitlab-ce:latest
    container_name: gitlab
    restart: unless-stopped
    hostname: localhost
    environment:
      GITLAB_ROOT_PASSWORD: "${GITLAB_ROOT_PASSWORD}"
      GITLAB_OMNIBUS_CONFIG: |
        external_url 'http://localhost'
        gitlab_rails['gitlab_shell_ssh_port'] = 2222
        gitlab_rails['initial_root_password'] = "${GITLAB_ROOT_PASSWORD}"
        # Reduce memory usage for local development
        puma['worker_processes'] = 2
        sidekiq['concurrency'] = 5
        prometheus_monitoring['enable'] = false
    ports:
      - '8080:80'
      - '2222:22'
    volumes:
      - gitlab-config:/etc/gitlab
      - gitlab-logs:/var/log/gitlab
      - gitlab-data:/var/opt/gitlab
    shm_size: '256m'

  demo-site:
    image: nginx:alpine
    container_name: demo-site
    restart: unless-stopped
    ports:
      - '8081:80'
    volumes:
      - ../weather-app:/usr/share/nginx/html:ro

volumes:
  gitlab-config:
  gitlab-logs:
  gitlab-data:
